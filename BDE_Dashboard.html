<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สถานะความสำเร็จรายยุทธศาสตร์</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap');
    :root {
      --green: #43b02a;
      --green-dark: #168300;
      --green-soft: #eaf6e7;
      --yellow: #f1c232;
      --grey-100: #f7f8f8;
      --grey-200: #e4e8e6;
      --grey-300: #cfd7d2;
      --grey-500: #7b8a82;
      --black: #111;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Kanit', Arial, sans-serif;
    }

    button, input, textarea, select {
      font-family: 'Kanit', Arial, sans-serif;
    }

    body {
      margin: 0;
      font-family: 'Kanit', Arial, sans-serif;
      background: #f5f7f6;
      color: var(--black);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .title h1 {
      font-size: 30px;
      margin: 0 0 4px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title h1 span {
      color: var(--green);
    }

    .title p {
      margin: 0;
      color: var(--grey-500);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      background: var(--white);
      border: 1px solid var(--grey-200);
      border-radius: 999px;
      padding: 5px;
      box-shadow: 0 8px 22px rgba(20, 40, 30, 0.06);
    }

    .tab-btn {
      border: 0;
      background: transparent;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      color: var(--grey-500);
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--green);
      color: var(--white);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(30, 70, 50, 0.12);
    }

    .btn-primary {
      background: var(--green);
      color: var(--white);
    }

    .btn-secondary {
      background: var(--green-soft);
      color: var(--green-dark);
      border: 1px solid #cbe7c4;
    }

    .btn-danger {
      background: #fff0f0;
      color: #b42318;
      border: 1px solid #ffd7d7;
    }

    .btn-light {
      background: var(--white);
      color: var(--grey-500);
      border: 1px solid var(--grey-200);
    }

    .plan-info-card {
      background: var(--white);
      border: 1px solid var(--grey-200);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(25, 50, 35, 0.06);
      margin-bottom: 16px;
    }

    .section-heading {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 800;
      color: #111;
    }

    .plan-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid {
      display: grid;
      gap: 16px;
    }

    .submit-bottom {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
      padding-bottom: 8px;
    }

    .submit-bottom .btn {
      min-width: 240px;
    }

    .strategy-form-card {
      background: var(--white);
      border: 1px solid var(--grey-200);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(25, 50, 35, 0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-top h3 {
      margin: 0;
      font-size: 18px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 90px 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--grey-500);
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--grey-300);
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 14px;
      font-family: inherit;
      background: var(--white);
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(67, 176, 42, 0.12);
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .desc-row {
      margin-bottom: 14px;
    }

    .indicator-list,
    .overall-target-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .indicator-row,
    .overall-target-row {
      display: grid;
      grid-template-columns: 1fr 160px 160px 180px 42px;
      gap: 8px;
      align-items: center;
      background: var(--grey-100);
      border: 1px solid var(--grey-200);
      border-radius: 12px;
      padding: 8px;
    }

    .remove-small {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #b42318;
      font-weight: 800;
      cursor: pointer;
    }

    .overall-target-dashboard {
      display: none;
      background: #dff4d6;
      border: 1px solid #cdeac2;
      border-radius: 22px;
      padding: 22px;
      margin: 8px 0 22px;
      box-shadow: 0 14px 34px rgba(24, 54, 35, 0.07);
    }

    .overall-target-dashboard.active {
      display: block;
    }

    .overall-target-title {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 900;
      color: #0f1712;
    }

    .overall-target-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .overall-target-card {
      min-height: 150px;
      background: #ffffff;
      border: 1px solid #d8e8d1;
      border-radius: 16px;
      padding: 20px 18px;
      box-shadow: 0 10px 24px rgba(24, 54, 35, 0.06);
      position: relative;
      overflow: hidden;
    }

    .overall-target-card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8px;
      background: var(--green);
      opacity: 0.9;
    }

    .overall-target-name {
      margin: 0 0 14px;
      color: #3b4a42;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
      min-height: 38px;
    }

    .overall-target-value {
      font-size: 30px;
      font-weight: 900;
      color: #0f1712;
      letter-spacing: -0.4px;
      line-height: 1.1;
    }

    .overall-target-status {
      display: inline-flex;
      margin-top: 14px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .overall-target-status.completed {
      color: var(--green-dark);
      background: #d8f0d2;
    }

    .overall-target-status.in_progress {
      color: #7a5a00;
      background: #fff2bf;
    }

    .overall-target-status.not_started {
      color: #5f6f66;
      background: #edf1ef;
    }

    .result-section-title {
      margin: 2px 0 12px;
      font-size: 20px;
      font-weight: 900;
      color: #0f1712;
    }

    .overall-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 8px 0 22px;
    }

    .summary-kpi {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 110px;
      padding: 20px 22px;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid #dfe8e3;
      box-shadow: 0 12px 30px rgba(24, 54, 35, 0.07);
      position: relative;
      overflow: hidden;
    }

    .summary-kpi::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 7px;
    }

    .summary-kpi.completed::before { background: var(--green); }
    .summary-kpi.progress::before { background: var(--yellow); }
    .summary-kpi.pending::before { background: #b9c4be; }

    .kpi-donut {
      --p: 0;
      --c: var(--green);
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: conic-gradient(var(--c) calc(var(--p) * 1%), #edf1ef 0);
      position: relative;
      box-shadow: 0 8px 18px rgba(20, 50, 30, 0.08);
    }

    .kpi-donut::before {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #e8efeb;
    }

    .kpi-donut span {
      position: relative;
      z-index: 1;
      font-size: 13px;
      font-weight: 900;
      color: #111;
      line-height: 1;
    }

    .summary-kpi.completed .kpi-donut { --c: var(--green); }
    .summary-kpi.progress .kpi-donut { --c: var(--yellow); }
    .summary-kpi.pending .kpi-donut { --c: #b9c4be; }

    .kpi-content {
      position: relative;
      z-index: 1;
    }

    .kpi-label {
      margin: 0 0 4px;
      color: #5f6f66;
      font-size: 14px;
      font-weight: 700;
    }

    .kpi-main {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 3px;
    }

    .kpi-number {
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
      color: #111;
      letter-spacing: -0.5px;
    }

    .kpi-unit {
      font-size: 14px;
      color: #68756d;
      font-weight: 700;
    }

    .kpi-percent {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      background: #f5f8f6;
      border: 1px solid #e3ebe6;
      color: #52645a;
      font-size: 12px;
      font-weight: 800;
    }

    .dashboard-wrap {
      background: transparent;
      border: 0;
      margin-top: 12px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .summary-card {
      min-height: 245px;
      padding: 30px 32px 26px;
      border: 1px solid #d8e2dc;
      border-radius: 22px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdfb 100%);
      box-shadow: 0 14px 34px rgba(24, 54, 35, 0.08);
      position: relative;
      overflow: hidden;
    }

    .summary-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--green), #a8dc8f);
    }

    .strategy-line {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .strategy-no {
      font-size: 20px;
      font-weight: 900;
      color: #0f1712;
      letter-spacing: -0.3px;
    }

    .strategy-theme {
      font-size: 18px;
      font-weight: 900;
      color: var(--green-dark);
      background: var(--green-soft);
      border: 1px solid #d5ecd0;
      border-radius: 999px;
      padding: 4px 12px;
    }

    .strategy-desc {
      margin: 0 0 28px;
      font-size: 14px;
      color: #2e3b34;
      line-height: 1.45;
      min-height: 42px;
      position: relative;
      z-index: 1;
    }

    .progress-blocks {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .block {
      width: 34px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      background: #e4eae7;
      border-right: 0;
      border-radius: 8px;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.04);
    }

    .block.completed {
      background: var(--green);
    }

    .block.in_progress {
      background: var(--yellow);
      color: #4a3a00;
    }

    .block.not_started {
      background: #e4e9e6;
      color: #fff;
    }

    .progress-meta {
      color: #63746a;
      font-size: 14px;
      padding: 9px 12px;
      border-radius: 12px;
      background: #f5f8f6;
      border: 1px solid #e3ebe6;
      display: inline-block;
      position: relative;
      z-index: 1;
    }

    .indicator-values {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .value-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid #dfe8e3;
      border-radius: 999px;
      background: #ffffff;
      color: #52645a;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 5px 12px rgba(20, 50, 30, 0.05);
    }

    .value-chip span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 11px;
    }

    .progress-meta strong {
      color: #68756d;
      font-weight: 500;
    }

    .empty {
      min-height: 320px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--grey-500);
      font-size: 18px;
      font-weight: 600;
    }

    .dashboard-grid .empty {
      grid-column: 1 / -1;
    }

    .history-list {
      display: grid;
      gap: 14px;
    }

    .history-card {
      background: #ffffff;
      border: 1px solid #dfe8e3;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 26px rgba(24, 54, 35, 0.06);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .history-title {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 800;
      color: #111;
    }

    .history-plan {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
      color: var(--green-dark);
    }

    .history-meta {
      margin: 0;
      color: #68756d;
      font-size: 13px;
      font-weight: 600;
    }

    .history-actions,
    .history-top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .legend {
      display: flex;
      gap: 14px;
      align-items: center;
      color: var(--grey-500);
      font-size: 13px;
      flex-wrap: wrap;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: -1px;
    }

    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.grey { background: #dfe5e2; }

    @media (max-width: 900px) {
      .overall-summary,
      .overall-target-grid {
        grid-template-columns: 1fr;
      }
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .inputs {
        grid-template-columns: 1fr;
      }

      .plan-info-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .summary-card,
      .summary-card:nth-child(3n),
      .summary-card:nth-last-child(-n+3) {
        border: 1px solid #d8e2dc;
      }

      .indicator-row,
      .overall-target-row {
        grid-template-columns: 1fr;
      }

      .history-card {
        grid-template-columns: 1fr;
      }

      .history-actions,
      .history-top-actions {
        justify-content: flex-start;
      }

      .remove-small {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="title">
        <h1>สถานะความสำเร็จราย <span>ยุทธศาสตร์</span></h1>

      </div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('input')">Input Form</button>
        <button class="tab-btn" onclick="switchTab('result')">Result Dashboard</button>
        <button class="tab-btn" onclick="switchTab('history')">History</button>
      </div>
    </section>

    <section id="input" class="panel active">
      <div class="plan-info-card">
        <h3 class="section-heading">ข้อมูลทั่วไป</h3>
        <div class="plan-info-grid">
          <div class="input-group">
            <label>ชื่อแผน</label>
            <input type="text" id="planName" placeholder="ระบุชื่อแผน" onchange="updatePlanInfo()">
          </div>
          <div class="input-group">
            <label>ชื่อหน่วยงาน</label>
            <input type="text" id="agencyName" placeholder="ระบุชื่อหน่วยงาน" onchange="updatePlanInfo()">
          </div>
        </div>
      </div>

      <div class="plan-info-card">
        <div class="card-top">
          <h3 class="section-heading" style="margin:0;">เป้าหมายรวม</h3>
          <button class="btn btn-secondary" onclick="addOverallTarget()">+ Add ตัวชี้วัดรวม</button>
        </div>
        <div id="overallTargetForms" class="overall-target-list"></div>
      </div>

      <div class="toolbar">
        <div></div>
        <div>
          <button class="btn btn-secondary" onclick="addStrategy()">+ Add ยุทธศาสตร์</button>
        </div>
      </div>

      <div id="strategyForms" class="form-grid"></div>

      <div class="submit-bottom">
        <button class="btn btn-primary" onclick="generateDashboard()">Submit / Generate Dashboard</button>
      </div>
    </section>

    <section id="result" class="panel">
      <div class="toolbar">
        <div></div>
        <button class="btn btn-light" onclick="switchTab('input')">กลับไปแก้ไขข้อมูล</button>
      </div>

      <div id="overallTargetDashboard" class="overall-target-dashboard"></div>

      <h3 id="strategyKpiTitle" class="result-section-title">สถานะความสำเร็จตัวชี้วัดรายยุทธศาสตร์</h3>
      <div id="overallSummary" class="overall-summary"></div>

      <div class="dashboard-wrap">
        <div id="dashboardGrid" class="dashboard-grid"></div>
      </div>
    </section>

    <section id="history" class="panel">
      <div class="toolbar">
        <div></div>
        <div class="history-top-actions">
          <button class="btn btn-secondary" onclick="exportAllHistoryToExcel()">Export Excel ทั้งหมด</button>
          <button class="btn btn-danger" onclick="clearHistory()">ลบประวัติทั้งหมด</button>
        </div>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <script>
    let planInfo = {
      planName: "",
      agencyName: ""
    };

    let overallTargets = [
      { name: "", value: "", target: "", status: "not_started" }
    ];

    let strategies = [
      {
        no: 1,
        theme: "",
        description: "",
        indicators: [
          { name: "", value: "", target: "", status: "not_started" }
        ]
      }
    ];

    function switchTab(tabName) {
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      const buttons = document.querySelectorAll('.tab-btn');
      if (tabName === 'input') buttons[0].classList.add('active');
      if (tabName === 'result') buttons[1].classList.add('active');
      if (tabName === 'history') {
        buttons[2].classList.add('active');
        renderHistory();
      }
    }

    function renderForms() {
      const planNameInput = document.getElementById('planName');
      const agencyNameInput = document.getElementById('agencyName');
      if (planNameInput) planNameInput.value = planInfo.planName || '';
      if (agencyNameInput) agencyNameInput.value = planInfo.agencyName || '';

      renderOverallTargetForms();

      const container = document.getElementById('strategyForms');
      container.innerHTML = '';

      strategies.forEach((strategy, strategyIndex) => {
        const card = document.createElement('div');
        card.className = 'strategy-form-card';

        card.innerHTML = `
          <div class="card-top">
            <h3>ยุทธศาสตร์ที่ ${strategyIndex + 1}</h3>
            <button class="btn btn-danger" onclick="removeStrategy(${strategyIndex})">ลบยุทธศาสตร์</button>
          </div>

          <div class="input-group desc-row">
            <label>ชื่อยุทธศาสตร์</label>
            <input type="text" value="${escapeHtml(strategy.theme)}" placeholder="ระบุชื่อยุทธศาสตร์" onchange="updateStrategy(${strategyIndex}, 'theme', this.value)">
          </div>

          <div class="input-group desc-row">
            <label>คำอธิบายยุทธศาสตร์</label>
            <textarea placeholder="ระบุคำอธิบายยุทธศาสตร์" onchange="updateStrategy(${strategyIndex}, 'description', this.value)">${escapeHtml(strategy.description)}</textarea>
          </div>

          <div class="card-top">
            <h3 style="font-size:15px;">ตัวชี้วัด</h3>
            <button class="btn btn-secondary" onclick="addIndicator(${strategyIndex})">+ Add ตัวชี้วัด</button>
          </div>

          <div class="indicator-list">
            ${strategy.indicators.map((indicator, indicatorIndex) => `
              <div class="indicator-row">
                <input type="text" value="${escapeHtml(indicator.name)}" placeholder="ชื่อตัวชี้วัด" onchange="updateIndicator(${strategyIndex}, ${indicatorIndex}, 'name', this.value)">
                <input type="text" value="${escapeHtml(indicator.target || '')}" placeholder="ค่าเป้าหมาย เช่น 100%" onchange="updateIndicator(${strategyIndex}, ${indicatorIndex}, 'target', this.value)">
                <input type="text" value="${escapeHtml(indicator.value || '')}" placeholder="ค่าปัจจุบัน เช่น 75%" onchange="updateIndicator(${strategyIndex}, ${indicatorIndex}, 'value', this.value)">
                <select onchange="updateIndicator(${strategyIndex}, ${indicatorIndex}, 'status', this.value)">
                  <option value="completed" ${indicator.status === 'completed' ? 'selected' : ''}>บรรลุผลสำเร็จ</option>
                  <option value="not_started" ${indicator.status !== 'completed' ? 'selected' : ''}>ยังไม่บรรลุผลสำเร็จ</option>
                </select>
                <button class="remove-small" onclick="removeIndicator(${strategyIndex}, ${indicatorIndex})">×</button>
              </div>
            `).join('')}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function updatePlanInfo() {
      planInfo.planName = document.getElementById('planName').value;
      planInfo.agencyName = document.getElementById('agencyName').value;
    }

    function renderOverallTargetForms() {
      const container = document.getElementById('overallTargetForms');
      if (!container) return;

      container.innerHTML = overallTargets.map((target, targetIndex) => `
        <div class="overall-target-row">
          <input type="text" value="${escapeHtml(target.name)}" placeholder="ชื่อตัวชี้วัดรวม" onchange="updateOverallTarget(${targetIndex}, 'name', this.value)">
          <input type="text" value="${escapeHtml(target.target || '')}" placeholder="ค่าเป้าหมาย เช่น 100%" onchange="updateOverallTarget(${targetIndex}, 'target', this.value)">
          <input type="text" value="${escapeHtml(target.value || '')}" placeholder="ค่าปัจจุบัน เช่น 75%" onchange="updateOverallTarget(${targetIndex}, 'value', this.value)">
          <select onchange="updateOverallTarget(${targetIndex}, 'status', this.value)">
            <option value="completed" ${target.status === 'completed' ? 'selected' : ''}>บรรลุผลสำเร็จ</option>
            <option value="not_started" ${target.status !== 'completed' ? 'selected' : ''}>ยังไม่บรรลุผลสำเร็จ</option>
          </select>
          <button class="remove-small" onclick="removeOverallTarget(${targetIndex})">×</button>
        </div>
      `).join('');
    }

    function addOverallTarget() {
      overallTargets.push({ name: "", value: "", target: "", status: "not_started" });
      renderOverallTargetForms();
    }

    function updateOverallTarget(index, field, value) {
      overallTargets[index][field] = value;
    }

    function removeOverallTarget(index) {
      overallTargets.splice(index, 1);
      renderOverallTargetForms();
    }

    function addStrategy() {
      const nextNo = strategies.length + 1;
      strategies.push({
        no: nextNo,
        theme: "",
        description: "",
        indicators: [
          { name: "", value: "", target: "", status: "not_started" }
        ]
      });
      renderForms();
    }

    function removeStrategy(index) {
      strategies.splice(index, 1);
      renderForms();
    }

    function updateStrategy(index, field, value) {
      strategies[index][field] = field === 'no' ? Number(value) : value;
    }

    function addIndicator(strategyIndex) {
      strategies[strategyIndex].indicators.push({
        name: "",
        value: "",
        target: "",
        status: "not_started"
      });
      renderForms();
    }

    function removeIndicator(strategyIndex, indicatorIndex) {
      strategies[strategyIndex].indicators.splice(indicatorIndex, 1);
      renderForms();
    }

    function updateIndicator(strategyIndex, indicatorIndex, field, value) {
      strategies[strategyIndex].indicators[indicatorIndex][field] = value;
    }

    function generateDashboard(shouldSave = true) {
      const grid = document.getElementById('dashboardGrid');
      const overallSummary = document.getElementById('overallSummary');
      const overallTargetDashboard = document.getElementById('overallTargetDashboard');
      const strategyKpiTitle = document.getElementById('strategyKpiTitle');
      grid.innerHTML = '';
      overallSummary.innerHTML = '';
      overallTargetDashboard.innerHTML = '';
      overallTargetDashboard.classList.remove('active');
      strategyKpiTitle.style.display = 'none';

      const hasOverallTargetData = overallTargets.some(item => item.name || item.value || item.target);
      const visibleStrategies = strategies.filter(strategy => {
        const hasStrategyText = strategy.theme || strategy.description;
        const hasIndicatorData = strategy.indicators.some(item => item.name || item.value || item.target);
        return hasStrategyText || hasIndicatorData;
      });

      if (!visibleStrategies.length) {
        renderOverallTargetDashboard();
        overallSummary.innerHTML = '';
        grid.innerHTML = '';
        if (shouldSave && hasOverallTargetData) saveSubmission();
        switchTab('result');
        return;
      }

      const allIndicators = visibleStrategies.flatMap(strategy => strategy.indicators.filter(item => item.name || item.value || item.target));
      const totalIndicators = allIndicators.length;
      const totalCompleted = allIndicators.filter(item => item.status === 'completed').length;
      const totalProgress = allIndicators.filter(item => item.status === 'in_progress').length;
      const totalPending = allIndicators.filter(item => item.status === 'not_started').length;

      renderOverallTargetDashboard();
      strategyKpiTitle.style.display = 'block';
      renderOverallSummary(totalIndicators, totalCompleted, totalProgress, totalPending);

      visibleStrategies.forEach(strategy => {
        const visibleIndicators = strategy.indicators.filter(item => item.name || item.value || item.target);
        const total = visibleIndicators.length;
        const completed = visibleIndicators.filter(item => item.status === 'completed').length;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        const card = document.createElement('div');
        card.className = 'summary-card';
        card.innerHTML = `
          <div class="strategy-line">
            <span class="strategy-no">ยุทธศาสตร์ที่ ${strategy.no}</span>
            <span class="strategy-theme">${escapeHtml(strategy.theme || '-')}</span>
          </div>
          <p class="strategy-desc">${escapeHtml(strategy.description || '-')}</p>
          <div class="progress-blocks">
            ${visibleIndicators.map((indicator, index) => `
              <div class="block ${indicator.status}" title="${escapeHtml(indicator.name || 'ตัวชี้วัด')}">${index + 1}</div>
            `).join('')}
          </div>
          <div class="progress-meta">
            <strong>${percent}%</strong> &nbsp;•&nbsp; บรรลุผลสำเร็จ ${completed}/${total} ตัวชี้วัด
          </div>
          <div class="indicator-values">
            ${visibleIndicators.map((indicator, index) => `
              <div class="value-chip"><span>${index + 1}</span>${escapeHtml(indicator.value || '-')}</div>
            `).join('')}
          </div>
        `;
        grid.appendChild(card);
      });

      if (shouldSave) saveSubmission();
      switchTab('result');
    }

    function saveSubmission() {
      const submissions = JSON.parse(localStorage.getItem('strategySubmissions') || '[]');
      const visibleStrategies = strategies.filter(strategy => {
        const hasStrategyText = strategy.theme || strategy.description;
        const hasIndicatorData = strategy.indicators.some(item => item.name || item.value || item.target);
        return hasStrategyText || hasIndicatorData;
      });
      const allIndicators = visibleStrategies.flatMap(strategy => strategy.indicators.filter(item => item.name || item.value || item.target));
      const total = allIndicators.length;
      const completed = allIndicators.filter(item => item.status === 'completed').length;
      const progress = allIndicators.filter(item => item.status === 'in_progress').length;
      const pending = allIndicators.filter(item => item.status === 'not_started').length;
      const now = new Date();

      submissions.unshift({
        id: Date.now(),
        submittedAt: now.toLocaleString('th-TH'),
        planInfo: JSON.parse(JSON.stringify(planInfo)),
        overallTargets: JSON.parse(JSON.stringify(overallTargets)),
        strategies: JSON.parse(JSON.stringify(strategies)),
        summary: { total, completed, progress, pending }
      });

      localStorage.setItem('strategySubmissions', JSON.stringify(submissions));
    }

    function renderHistory() {
      const historyList = document.getElementById('historyList');
      const submissions = JSON.parse(localStorage.getItem('strategySubmissions') || '[]');

      if (!submissions.length) {
        historyList.innerHTML = '';
        return;
      }

      historyList.innerHTML = submissions.map((item, index) => `
        <div class="history-card">
          <div>
            <p class="history-title">ครั้งที่ ${submissions.length - index} • ${item.submittedAt}</p>
            <p class="history-plan">${escapeHtml(item.planInfo?.planName || '-')} • ${escapeHtml(item.planInfo?.agencyName || '-')}</p>
            <p class="history-meta">
              ${item.strategies.length} ยุทธศาสตร์ • ${item.summary.total} ตัวชี้วัด • บรรลุผลสำเร็จ ${item.summary.completed} • ยังไม่บรรลุผลสำเร็จ ${(item.summary.progress || 0) + (item.summary.pending || 0)}
            </p>
          </div>
          <div class="history-actions">
            <button class="btn btn-secondary" onclick="loadSubmission(${item.id})">เปิดดู / แก้ไข</button>
            <button class="btn btn-primary" onclick="exportSubmissionToExcel(${item.id})">Export Excel</button>
            <button class="btn btn-danger" onclick="deleteSubmission(${item.id})">ลบ</button>
          </div>
        </div>
      `).join('');
    }

    function loadSubmission(id) {
      const submissions = JSON.parse(localStorage.getItem('strategySubmissions') || '[]');
      const selected = submissions.find(item => item.id === id);
      if (!selected) return;

      planInfo = selected.planInfo ? JSON.parse(JSON.stringify(selected.planInfo)) : { planName: "", agencyName: "" };
      overallTargets = selected.overallTargets ? JSON.parse(JSON.stringify(selected.overallTargets)) : [{ name: "", value: "", target: "", status: "not_started" }];
      strategies = JSON.parse(JSON.stringify(selected.strategies));
      renderForms();
      generateDashboard(false);
      switchTab('input');
    }

    function deleteSubmission(id) {
      const submissions = JSON.parse(localStorage.getItem('strategySubmissions') || '[]');
      const updated = submissions.filter(item => item.id !== id);
      localStorage.setItem('strategySubmissions', JSON.stringify(updated));
      renderHistory();
    }

    function clearHistory() {
      localStorage.setItem('strategySubmissions', '[]');
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
    }


    function exportSubmissionToExcel(id) {
      const submissions = JSON.parse(localStorage.getItem('strategySubmissions') || '[]');
      const selected = submissions.find(item => item.id === id);
      if (!selected) return;
      const safeDate = String(selected.submittedAt || Date.now()).replace(/[\\/:*?"<>|,\s]+/g, '_');
      exportWorkbookXml([selected], `BDE_Dashboard_${safeDate}.xls`);
    }

    function exportAllHistoryToExcel() {
      const submissions = JSON.parse(localStorage.getItem('strategySubmissions') || '[]');
      if (!submissions.length) return;
      exportWorkbookXml(submissions, 'BDE_Dashboard_History_All.xls');
    }

    function exportWorkbookXml(submissions, filename) {
      const summaryRows = [];
      const overallRows = [];
      const strategyRows = [];
      const indicatorRows = [];

      submissions.forEach((item, submissionIndex) => {
        const submissionNo = submissions.length - submissionIndex;
        const planName = item.planInfo?.planName || '';
        const agencyName = item.planInfo?.agencyName || '';

        summaryRows.push({
          'ครั้งที่': submissionNo,
          'วันที่ Submit': item.submittedAt || '',
          'ชื่อแผน': planName,
          'ชื่อหน่วยงาน': agencyName,
          'จำนวนยุทธศาสตร์': getVisibleStrategies(item.strategies || []).length,
          'จำนวนตัวชี้วัดทั้งหมด': item.summary?.total ?? 0,
          'บรรลุผลสำเร็จ': item.summary?.completed ?? 0,
          'ยังไม่บรรลุผลสำเร็จ': (item.summary?.progress ?? 0) + (item.summary?.pending ?? 0),
          'อยู่ระหว่างดำเนินการ': item.summary?.progress ?? 0,
          'ยังไม่มีการดำเนินการ': item.summary?.pending ?? 0
        });

        (item.overallTargets || []).forEach((target, targetIndex) => {
          if (!(target.name || target.value || target.target)) return;
          overallRows.push({
            'ครั้งที่': submissionNo,
            'วันที่ Submit': item.submittedAt || '',
            'ชื่อแผน': planName,
            'ชื่อหน่วยงาน': agencyName,
            'ลำดับตัวชี้วัดรวม': targetIndex + 1,
            'ชื่อตัวชี้วัดรวม': target.name || '',
            'ค่าเป้าหมาย': target.target || '',
            'ค่าปัจจุบัน': target.value || '',
            'สถานะ': getStatusText(target.status)
          });
        });

        getVisibleStrategies(item.strategies || []).forEach((strategy, strategyIndex) => {
          const visibleIndicators = (strategy.indicators || []).filter(ind => ind.name || ind.value || ind.target);
          const completed = visibleIndicators.filter(ind => ind.status === 'completed').length;
          const progress = visibleIndicators.filter(ind => ind.status === 'in_progress').length;
          const pending = visibleIndicators.filter(ind => ind.status === 'not_started').length;
          const percent = visibleIndicators.length ? Math.round((completed / visibleIndicators.length) * 100) : 0;

          strategyRows.push({
            'ครั้งที่': submissionNo,
            'วันที่ Submit': item.submittedAt || '',
            'ชื่อแผน': planName,
            'ชื่อหน่วยงาน': agencyName,
            'ลำดับยุทธศาสตร์': strategyIndex + 1,
            'ชื่อยุทธศาสตร์': strategy.theme || '',
            'คำอธิบายยุทธศาสตร์': strategy.description || '',
            'จำนวนตัวชี้วัด': visibleIndicators.length,
            'สำเร็จแล้ว': completed,
            'อยู่ระหว่างดำเนินการ': progress,
            'ยังไม่มีการดำเนินการ': pending,
            '% สำเร็จ': percent
          });

          visibleIndicators.forEach((indicator, indicatorIndex) => {
            indicatorRows.push({
              'ครั้งที่': submissionNo,
              'วันที่ Submit': item.submittedAt || '',
              'ชื่อแผน': planName,
              'ชื่อหน่วยงาน': agencyName,
              'ลำดับยุทธศาสตร์': strategyIndex + 1,
              'ชื่อยุทธศาสตร์': strategy.theme || '',
              'ลำดับตัวชี้วัด': indicatorIndex + 1,
              'ชื่อตัวชี้วัด': indicator.name || '',
              'ค่าเป้าหมาย': indicator.target || '',
              'ค่าปัจจุบัน': indicator.value || '',
              'สถานะ': getStatusText(indicator.status)
            });
          });
        });
      });

      const sheets = [
        { name: 'Summary', rows: summaryRows },
        { name: 'Overall_Targets', rows: overallRows },
        { name: 'Strategies', rows: strategyRows },
        { name: 'Indicators', rows: indicatorRows }
      ];

      const xml = buildExcelXml(sheets);
      downloadTextFile(xml, filename, 'application/vnd.ms-excel;charset=utf-8;');
    }

    function buildExcelXml(sheets) {
      const workbookStart = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="Header">
   <Font ss:Bold="1"/>
   <Interior ss:Color="#EAF6E7" ss:Pattern="Solid"/>
  </Style>
 </Styles>`;
      const workbookEnd = `</Workbook>`;

      const worksheets = sheets.map(sheet => {
        const rows = sheet.rows && sheet.rows.length ? sheet.rows : [{ 'ข้อมูล': 'ไม่มีข้อมูล' }];
        const headers = Object.keys(rows[0]);
        const headerRow = `<Row>${headers.map(h => `<Cell ss:StyleID="Header"><Data ss:Type="String">${xmlEscape(h)}</Data></Cell>`).join('')}</Row>`;
        const dataRows = rows.map(row => {
          return `<Row>${headers.map(h => {
            const value = row[h] ?? '';
            const isNumber = typeof value === 'number' && isFinite(value);
            return `<Cell><Data ss:Type="${isNumber ? 'Number' : 'String'}">${xmlEscape(value)}</Data></Cell>`;
          }).join('')}</Row>`;
        }).join('');
        const columns = headers.map(() => `<Column ss:Width="140"/>`).join('');
        return `<Worksheet ss:Name="${xmlEscape(sheet.name).slice(0, 31)}"><Table>${columns}${headerRow}${dataRows}</Table></Worksheet>`;
      }).join('');

      return workbookStart + worksheets + workbookEnd;
    }

    function downloadTextFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function xmlEscape(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function getVisibleStrategies(strategyList) {
      return strategyList.filter(strategy => {
        const hasStrategyText = strategy.theme || strategy.description;
        const hasIndicatorData = (strategy.indicators || []).some(item => item.name || item.value || item.target);
        return hasStrategyText || hasIndicatorData;
      });
    }

    function renderOverallTargetDashboard() {
      const dashboard = document.getElementById('overallTargetDashboard');
      const visibleTargets = overallTargets.filter(item => item.name || item.value);

      if (!visibleTargets.length) {
        dashboard.innerHTML = '';
        dashboard.classList.remove('active');
        return;
      }

      dashboard.classList.add('active');
      dashboard.innerHTML = `
        <h3 class="overall-target-title">สถานะความสำเร็จของตัวชี้วัดรวม</h3>
        <div class="overall-target-grid">
          ${visibleTargets.map(item => `
            <div class="overall-target-card">
              <p class="overall-target-name">${escapeHtml(item.name || '-')}</p>
              <div class="overall-target-value">${escapeHtml(item.value || '-')}</div>
              <span class="overall-target-status ${item.status}">${getStatusText(item.status)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function getStatusText(status) {
      if (status === 'completed') return 'บรรลุผลสำเร็จ';
      return 'ยังไม่บรรลุผลสำเร็จ';
    }

    function renderOverallSummary(total, completed, progress, pending) {
      const overallSummary = document.getElementById('overallSummary');
      const completedPercent = total === 0 ? 0 : Math.round((completed / total) * 100);
      const notCompleted = progress + pending;
      const notCompletedPercent = total === 0 ? 0 : Math.round((notCompleted / total) * 100);

      overallSummary.innerHTML = `
        <div class="summary-kpi completed">
          <div class="kpi-donut" style="--p:${completedPercent}"><span>${completedPercent}%</span></div>
          <div class="kpi-content">
            <p class="kpi-label">ตัวชี้วัดบรรลุผลสำเร็จ</p>
            <div class="kpi-main"><span class="kpi-number">${completed}</span><span class="kpi-unit">ตัวชี้วัด</span></div>
            <span class="kpi-percent">จากทั้งหมด ${total} ตัวชี้วัด</span>
          </div>
        </div>
        <div class="summary-kpi pending">
          <div class="kpi-donut" style="--p:${notCompletedPercent}"><span>${notCompletedPercent}%</span></div>
          <div class="kpi-content">
            <p class="kpi-label">ตัวชี้วัดยังไม่บรรลุผลสำเร็จ</p>
            <div class="kpi-main"><span class="kpi-number">${notCompleted}</span><span class="kpi-unit">ตัวชี้วัด</span></div>
            <span class="kpi-percent">จากทั้งหมด ${total} ตัวชี้วัด</span>
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    renderForms();
    switchTab('input');
  </script>
</body>
</html>
